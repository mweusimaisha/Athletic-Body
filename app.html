<title>Athletic Body Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one 560px phone column of stacked cards, fixed bottom nav, sheets slide up for forms */
:root{
  --bg:#f2f3ee; --surface:#ffffff; --surface-2:#e8eae3; --line:#d7dad1; --fg:#1a1e1b; --muted:#5d645d;
  --accent:#2d7449; --accent-2:#22593a; --accent-soft:#dcebe1; --on-accent:#ffffff;
  --carb:#94793a; --fat:#53677a; --track:#e1e4db;
  --warn:#9d5f0c; --warn-soft:#f6ebd5; --danger:#ad3b33; --danger-soft:#f5dfdb; --info-soft:#e3ebe5;
  --shadow:0 1px 2px rgba(20,32,24,.06),0 6px 18px rgba(20,32,24,.05);
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121413; --surface:#1b1e1c; --surface-2:#252926; --line:#30352f; --fg:#eceee8; --muted:#9ca39b;
  --accent:#62b385; --accent-2:#7cc79b; --accent-soft:#203328; --on-accent:#0d1710;
  --carb:#cdb16a; --fat:#93a8bd; --track:#2b302c;
  --warn:#e3ab4f; --warn-soft:#3a2f19; --danger:#e57c71; --danger-soft:#3e2220; --info-soft:#1f2a23;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121413; --surface:#1b1e1c; --surface-2:#252926; --line:#30352f; --fg:#eceee8; --muted:#9ca39b;
  --accent:#62b385; --accent-2:#7cc79b; --accent-soft:#203328; --on-accent:#0d1710;
  --carb:#cdb16a; --fat:#93a8bd; --track:#2b302c;
  --warn:#e3ab4f; --warn-soft:#3a2f19; --danger:#e57c71; --danger-soft:#3e2220; --info-soft:#1f2a23;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:1.35rem} h3{font-size:1.12rem}
.num,.tab{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 104px}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end} .row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:360px){.grid4{grid-template-columns:1fr 1fr}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px}
.appname{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase;line-height:1.05;white-space:nowrap}
.subdate{font-size:.8rem;color:var(--muted)}
.hdr-actions{display:flex;gap:6px;align-items:center}
.modepill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap}
.modepill svg{width:16px;height:16px}
.modepill.road{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none;padding:0}
.iconbtn svg{width:19px;height:19px}
.iconbtn.sm{width:32px;height:32px;border-radius:9px}
.iconbtn.sm svg{width:16px;height:16px}
.iconbtn:hover{border-color:var(--muted)}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.bnav button{background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer;letter-spacing:.02em}
.bnav button svg{width:22px;height:22px}
.bnav button.on{color:var(--accent)}

/* cards & bits */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h3{margin-bottom:8px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.card-h h3{margin:0}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.big{font-family:var(--display);font-weight:600;font-size:2rem;line-height:1}
.mid{font-family:var(--display);font-weight:600;font-size:1.45rem;line-height:1.05}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .row{gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:600;cursor:pointer;min-height:42px;text-decoration:none}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{min-height:34px;padding:6px 10px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:.85rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.subnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:15;background:var(--bg);padding-block:4px 10px}
.badge{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--surface-2);color:var(--muted);vertical-align:middle}
.badge.est{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
.badge.pend{background:var(--danger-soft);color:var(--danger)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.banner{border-radius:var(--r-sm);padding:12px 14px;font-size:.9rem;border:1px solid transparent}
.banner b{font-weight:700}
.banner.info{background:var(--info-soft);border-color:var(--line)}
.banner.warn{background:var(--warn-soft);color:var(--fg);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.banner.danger{background:var(--danger-soft);color:var(--fg);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.banner .row{margin-top:8px}
.empty{color:var(--muted);font-size:.88rem;margin:4px 0;padding:10px 0}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}

/* progress */
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.macro{display:flex;flex-direction:column;gap:5px}
.macro .row{justify-content:space-between}
.ringwrap{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media (max-width:380px){.ringwrap{grid-template-columns:1fr;justify-items:center}.ringwrap .stack{width:100%}}
.ring text{font-family:var(--display);fill:var(--fg)}
.ring .sub{font-family:var(--body);fill:var(--muted);font-size:10px}

/* weekly strip */
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font-size:.72rem;color:var(--muted)}
.wday b{font-family:var(--display);font-size:1.1rem;color:var(--fg);font-weight:600}
.wday.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.wday.on b{color:var(--bg)}
.wday.today:not(.on){border-color:var(--accent)}
.wday .dot{width:5px;height:5px;border-radius:9px;background:transparent}
.wday .dot.has{background:var(--accent)}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav .mid{font-size:1.25rem;text-align:center}
.weekbars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.wb{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:none;border:0;padding:0}
.wb .col{width:100%;max-width:30px;height:70px;background:var(--track);border-radius:7px;position:relative;overflow:hidden}
.wb .col i{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:7px}
.wb .col i.over{background:var(--warn)}
.wb .col .tline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6}
.wb span{font-size:.7rem;color:var(--muted)}
.wb .dots{display:flex;gap:3px;height:6px}
.wb .dots em{width:6px;height:6px;border-radius:6px;background:var(--track)}
.wb .dots em.p{background:var(--accent)} .wb .dots em.g{background:var(--fat)}
.wb.today span{color:var(--fg);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:8px;margin-right:4px;vertical-align:middle}

/* meals & entries */
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.meal-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.entry{display:flex;gap:10px;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.meal-h + .entry{margin-top:8px}
.entry-main{min-width:0;flex:1}
.entry-name{font-weight:600;overflow-wrap:anywhere}
.entry-act{display:flex;gap:4px;align-items:flex-start;flex:none}
.macros b{font-weight:700}
.note{color:var(--muted);font-style:italic;margin-top:2px;overflow-wrap:anywhere}
.todaymeal{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.todaymeal:first-of-type{border-top:0}
.todaymeal .tm{font-family:var(--display);font-size:.95rem;color:var(--muted);width:62px;flex:none}
.todaymeal .info{flex:1;min-width:0}
.todaymeal .info div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* forms */
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-height:42px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.check{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.form-err{color:var(--danger);font-weight:600;font-size:.88rem;margin:0}
.hint{font-size:.8rem;color:var(--muted)}
.hint.warn{color:var(--warn)}
.picklist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:240px;overflow-y:auto}
.picklist:empty{display:none}
.picklist button{text-align:left;background:var(--surface);border:0;border-top:1px solid var(--line);padding:9px 11px;cursor:pointer}
.picklist button:first-child{border-top:0}
.picklist button:hover{background:var(--surface-2)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{position:relative;flex:1;text-align:center;padding:9px 4px;cursor:pointer;font-weight:600;font-size:.85rem;border-left:1px solid var(--line)}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--fg);color:var(--bg)}

/* modal sheet */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,11,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:600px){#modal{align-items:center}.sheet{border-radius:20px;max-height:88vh}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-b{padding:14px 16px 20px;overflow-y:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
#toast.warn{background:var(--warn);color:#fff} #toast.danger{background:var(--danger);color:#fff}

/* swap */
.swap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swapside{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.swapside h4{margin:0;font-family:var(--display);font-size:1rem;font-weight:600;line-height:1.15}
.swapside .btn{margin-top:auto}
.swapside ul{margin:0;padding-left:16px;font-size:.8rem;color:var(--muted)}
.mtab{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;text-align:center;font-size:.75rem}
.mtab b{display:block;font-family:var(--display);font-size:1.05rem;font-weight:600}
.delta{font-size:.82rem;margin-top:8px}
.up{color:var(--warn)} .down{color:var(--accent)}

/* tables */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table.tbl{border-collapse:collapse;width:100%;font-size:.85rem}
.tbl th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 4px;font-weight:600}
.tbl td{padding:4px;border-top:1px solid var(--line);vertical-align:middle}
.tbl input[type=number],.tbl input[type=text]{min-height:36px;padding:6px 7px}
.tbl td.name{min-width:150px}
.tbl input.n{width:62px}
.tbl .amt{display:flex;gap:4px;align-items:center}
.tbl select.u-sel{width:auto;min-height:36px;padding:5px 4px;font-size:.82rem}

/* plan */
.planitem{display:grid;grid-template-columns:1fr 72px 34px auto;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}
.planitem .u{font-size:.78rem;color:var(--muted);white-space:nowrap}
.planitem input{min-height:34px;padding:5px 7px}
.planitem .nm{min-width:0;overflow-wrap:anywhere}
.subs{display:grid;gap:6px;font-size:.84rem;margin-top:10px}
.subs div{background:var(--surface-2);border-radius:10px;padding:7px 10px}
.subs div.hl{background:var(--accent-soft)}
.subs b{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:block}
.eaten{display:flex;align-items:center;gap:8px;font-weight:700;padding:8px 12px;border-radius:10px;background:var(--surface-2);cursor:pointer}
.eaten:has(input:checked){background:var(--accent-soft);color:var(--accent)}
.groc{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.groc.done .gname{text-decoration:line-through;color:var(--muted)}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.chart .lbl-strong{fill:var(--fg);font-weight:700;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats b{display:block;font-family:var(--display);font-size:1.2rem;font-weight:600}
.stats span{font-size:.72rem;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block;max-width:100%}
.photos figcaption{font-size:.7rem;color:var(--muted);text-align:center;margin-top:2px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.kv:first-child{border-top:0}
.kv span:last-child{font-weight:600;text-align:right}
.focus li{margin-bottom:6px}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:no-preference){.ring circle.prog{transition:stroke-dashoffset .5s ease}.bar>i{transition:width .4s ease}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 10 6l4 8 2-4 4 8"/></svg></div>
      <div style="min-width:0"><div class="appname">Athletic Body</div><div class="subdate" id="hdrDate"></div></div>
    </div>
    <div class="hdr-actions">
      <button class="modepill" id="modeBtn" data-act="toggleMode" aria-label="Switch between At Home and On the Road"></button>
      <button class="iconbtn" id="themeBtn" data-act="cycleTheme" aria-label="Change theme"></button>
      <button class="iconbtn" data-act="go" data-tab="settings" aria-label="Profile and settings" id="setBtn"></button>
    </div>
  </header>
  <main id="view" class="stack"></main>
</div>
<nav class="bnav" aria-label="Main"><div class="bnav-in" id="bnav"></div></nav>
<div id="modal" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
'use strict';
/* ================= utilities ================= */
const KEY='abp.v1';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1);};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d);};
const mondayOf=s=>{const d=parseISO(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d);};
const weekDates=s=>{const m=mondayOf(s);return [0,1,2,3,4,5,6].map(i=>addDays(m,i));};
const wdIdx=s=>(parseISO(s).getDay()+6)%7;
const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/864e5);
const fmt=n=>(n==null||isNaN(n))?'–':Math.round(n).toLocaleString();
const f1=n=>(n==null||isNaN(n))?'–':String(Math.round(n*10)/10);
const r1=n=>Math.round(n*10)/10;

function migrate(s){
  const d=defaults();
  const out={...d,...s};
  const sp=s.profile||{};
  out.profile={...d.profile,...sp,units:{...d.profile.units,...(sp.units||{})},targets:{...d.profile.targets,...(sp.targets||{})},
    mealTimes:{...d.profile.mealTimes,...(sp.mealTimes||{})},clearance:{...d.profile.clearance,...(sp.clearance||{})},thighRef:{...d.profile.thighRef,...(sp.thighRef||{})}};
  ['foods','log','activity','workouts','measurements','portions'].forEach(k=>{if(!Array.isArray(out[k]))out[k]=d[k];});
  ['days','templates','grocery','schedule','planSkip','prep'].forEach(k=>{if(!out[k]||typeof out[k]!=='object'||Array.isArray(out[k]))out[k]=d[k];});
  if(!Array.isArray(out.plan)||out.plan.length!==7)out.plan=d.plan;
  FOODS.forEach(b=>{if(!out.foods.some(x=>x.id===b.id))out.foods.push(clone(b));});
  if((s.version||1)<2){
    if(out.profile.targets.gym===4)out.profile.targets.gym=5;
    if(Object.keys(SCHED_V1).every(k=>out.schedule[k]===SCHED_V1[k]))out.schedule=clone(SCHED_SEED);
    out.version=2;
  }
  if(!Array.isArray(out.prep.selected))out.prep.selected=d.prep.selected;
  if(!out.prep.autoFrom)out.prep.autoFrom=today();
  if((s.version||1)<4)out.profile.autoLog=false; // meals log only when tapped (Settings can turn automatic logging back on)
  out.version=4;
  return out;
}

/* ================= domain helpers ================= */
const Z={kcal:0,p:0,c:0,f:0};
const foodById=(id,foods=S.foods)=>foods.find(x=>x.id===id);
function scaleFood(fd,q){const k=(+q||0)/(+fd.bq||1);return {kcal:fd.kcal*k,p:fd.p*k,c:fd.c*k,f:fd.f*k};}
function sum(list){return list.reduce((a,x)=>({kcal:a.kcal+(+x.kcal||0),p:a.p+(+x.p||0),c:a.c+(+x.c||0),f:a.f+(+x.f||0)}),{...Z});}
function itemsMacros(items,foods=S.foods){return sum(items.map(([id,q])=>{const fd=foodById(id,foods);return fd?scaleFood(fd,q):Z;}));}
function itemsEst(items,foods=S.foods){return items.some(([id])=>{const fd=foodById(id,foods);return !fd||fd.est;});}
function itemLabel([id,q],foods=S.foods){const fd=foodById(id,foods);if(!fd)return `Missing food (${id})`;return `${fd.name} ${qtyStr(q,fd.bu)}`;}
function qtyStr(q,u){const n=r1(+q);if(u==='g'||u==='ml')return `${n} ${u}`;if(u==='piece')return `× ${n}`;return `${n} ${u}${n!==1&&['cup','serving','tbsp','tsp'].includes(u)?'s':''}`;}
function mealCuisine(items,foods=S.foods){const cs=items.map(([id])=>foodById(id,foods)?.cuisine);return cs.includes('Nigerian')?'Nigerian':cs.includes('American')?'American':'Both';}
const dayLog=d=>S.log.filter(e=>e.date===d);
const dayTotals=d=>sum(dayLog(d));

const allT=()=>({...BUILTIN_T,...S.templates});
function currentWeightKg(){const m=S.measurements.filter(x=>x.weightKg!=null).sort((a,b)=>a.date.localeCompare(b.date));return m.length?m[m.length-1].weightKg:S.profile.startWeightKg;}

const wu=()=>S.profile.units.weight, lu=()=>S.profile.units.length, du=()=>S.profile.units.distance;
const kgD=kg=>kg==null?null:wu()==='lb'?kg*LB:kg;

function checkedIn(d){const di=dayInfo(d);return dayLog(d).some(e=>!e.auto||e.sub)||S.activity.some(a=>a.date===d)||S.workouts.some(w=>w.date===d)||!!di.rest||(+di.water>0)||(+di.stretch>0)||di.pain!=null;}
function streak(){let d=today();if(!checkedIn(d))d=addDays(d,-1);let n=0;while(n<3650&&checkedIn(d)){n++;d=addDays(d,-1);}return n;}
function planMealEntry(date,slot,extra={}){return itemsEntry(date,slot,S.plan[wdIdx(date)][slot].items,'From meal plan: ',extra);}
function itemsEntry(date,slot,items,prefix,extra={}){
  const mac=itemsMacros(items);
  return {id:uid(),date,meal:slot,time:S.profile.mealTimes[slot]||'',name:items.map(it=>foodById(it[0])?.name||'?').join(', '),cuisine:mealCuisine(items),qty:1,unit:'serving',state:'cooked',
    kcal:r1(mac.kcal),p:r1(mac.p),c:r1(mac.c),f:r1(mac.f),est:true,notes:prefix+items.map(it=>itemLabel(it)).join(' · '),planKey:`${date}|${slot}`,items:clone(items),...extra};
}
/* planned meals log themselves once their meal time passes, unless skipped or substituted */
function mealDue(date,slot){const t=today();if(date<t)return true;if(date>t)return false;const mt=S.profile.mealTimes[slot];return !mt||nowTime()>=mt;}
function autoLog(){
  if(!S.profile.autoLog)return 0;const t=today();let from=S.prep.autoFrom||t,n=0;if(daysBetween(from,t)>14)from=addDays(t,-14);
  for(let d=from;d<=t;d=addDays(d,1))PSLOTS.forEach(slot=>{const key=d+'|'+slot;
    if(S.planSkip[key]||S.log.some(e=>e.planKey===key)||!mealDue(d,slot))return;
    const m=S.plan[wdIdx(d)][slot];if(!m||!m.items.length)return;S.log.push(planMealEntry(d,slot,{auto:true}));n++;});
  if(n)save();return n;
}
function refreshAutoToday(){const t=today();S.log.forEach(e=>{if(e.auto&&!e.sub&&e.date===t){const n=planMealEntry(e.date,e.meal,{auto:true});Object.assign(e,n,{id:e.id});}});}

function ring(val,target,{size=128,sw=11,label='',sub=''}={}){
  const r=(size-sw)/2,C=2*Math.PI*r,pct=target>0?Math.min(Math.max(val,0)/target,1):0,over=target>0&&val>target*1.1;
  return `<svg class="ring" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${esc(label+' '+sub)}">
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/>
  <circle class="prog" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${over?'var(--warn)':'var(--accent)'}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct)).toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>
  <text x="50%" y="${size/2+2}" text-anchor="middle" font-size="${size/4.6}" font-weight="600">${esc(label)}</text>
  <text class="sub" x="50%" y="${size/2+18}" text-anchor="middle">${esc(sub)}</text></svg>`;
}
function macroBar(name,val,target,color){

}

function painPill(v){if(v==null||v==='')return '<span class="pill">–</span>';const n=+v;return `<span class="pill ${n>=7?'bad':n>=4?'warn':'good'}">${n}/10</span>`;}

function lineChart(pts,{unit='',target=null,h=190}={}){
  pts=pts.filter(p=>p.y!=null&&!isNaN(p.y)).sort((a,b)=>a.x.localeCompare(b.x));
  if(!pts.length)return `<div class="empty" style="text-align:center;padding:40px 0">No entries in this range yet. Add one and it will appear here.</div>`;
  const W=340,H=h,L=38,R=14,T=16,B=24;
  const xs=pts.map(p=>parseISO(p.x).getTime());let x0=Math.min(...xs),x1=Math.max(...xs);if(x0===x1){x0-=864e5*3;x1+=864e5*3;}
  const vals=pts.map(p=>p.y).concat(target!=null?[target]:[]);let y0=Math.min(...vals),y1=Math.max(...vals);
  const span=(y1-y0)||Math.max(Math.abs(y1)*0.05,1);y0-=span*0.15;y1+=span*0.15;if(Math.min(...pts.map(p=>p.y))>=0&&y0<0)y0=0;
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const P=pts.map((p,i)=>[X(xs[i]),Y(p.y)]);
  const line=P.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const area=line+` L${P[P.length-1][0].toFixed(1)} ${H-B} L${P[0][0].toFixed(1)} ${H-B} Z`;
  const ticks=[0,1,2].map(i=>y0+(y1-y0)*(0.15+i*0.35));
  const dec=(y1-y0)<10?1:0;
  const last=P[P.length-1],lp=pts[pts.length-1];
  const gid='g'+Math.random().toString(36).slice(2,7);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart of ${pts.length} entries">
  <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
  ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${v.toFixed(dec)}</text>`).join('')}
  ${target!=null?`<line x1="${L}" x2="${W-R}" y1="${Y(target).toFixed(1)}" y2="${Y(target).toFixed(1)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W-R}" y="${(Y(target)-4).toFixed(1)}" text-anchor="end">target</text>`:''}
  ${pts.length>1?`<path d="${area}" fill="url(#${gid})"/>`:''}
  <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  ${P.length<=40?P.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.6" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"/>`).join(''):''}
  <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5" fill="var(--accent)"/>
  <text class="lbl-strong" x="${Math.min(last[0],W-R-4).toFixed(1)}" y="${Math.max(last[1]-9,11).toFixed(1)}" text-anchor="end">${f1(lp.y)}${unit?' '+unit:''}</text>
  <text x="${L}" y="${H-6}">${fmtDate(pts[0].x,{month:'short',day:'numeric'})}</text>
  <text x="${W-R}" y="${H-6}" text-anchor="end">${fmtDate(lp.x,{month:'short',day:'numeric'})}</text></svg>`;
}

function planSlotState(date,slot){const key=date+'|'+slot;const e=S.log.find(x=>x.planKey===key);
  if(e)return {key,e,st:e.sub?'sub':'logged'};if(S.planSkip[key])return {key,st:'skipped'};
  if(S.profile.autoLog&&!mealDue(date,slot))return {key,st:'upcoming'};return {key,st:'open'};}
const isFast=key=>S.planSkip[key]==='fast';
/* a fasting day: every planned meal is fasted, apart from any you substituted (food you actually ate) */
const dayFasted=d=>{const keys=PSLOTS.map(s=>d+'|'+s);return keys.some(isFast)&&keys.every(k=>isFast(k)||S.log.some(e=>e.planKey===k&&e.sub));};
function statusPill(s){if(s.st==='skipped'&&isFast(s.key))return '<span class="pill">Fasted</span>';return {logged:'<span class="pill good">Logged</span>',sub:'<span class="pill warn">Substituted</span>',skipped:'<span class="pill">Skipped</span>',upcoming:'<span class="pill">Logs at meal time</span>',open:'<span class="pill">Not eaten yet</span>'}[s.st];}
function slotActions(s){const k=s.key;
  if(s.st==='skipped')return `<button class="btn sm" data-act="subReset" data-key="${k}">${isFast(k)?'Undo fast':'Undo skip'}</button>`;
  return `${s.st==='open'?`<button class="btn sm primary" data-act="eatPlanned" data-key="${k}">${I.check} Ate it</button>`:''}<button class="btn sm" data-act="subMeal" data-key="${k}">Substitute</button><button class="btn sm" data-act="subFast" data-key="${k}">Fasted</button>${s.st==='sub'?`<button class="btn sm ghost" data-act="subReset" data-key="${k}">Back to plan</button>`:''}${s.st==='logged'&&!S.profile.autoLog?`<button class="btn sm ghost" data-act="unlog" data-key="${k}">Undo</button>`:''}`;}
function todaysMeals(d){
  const plan=S.plan[wdIdx(d)];const road=S.profile.mode==='road';
  const rows=PSLOTS.map(slot=>{const s=planSlotState(d,slot),m=plan[slot];
    const label=s.e?s.e.name:(road?'Road: '+m.road:m.items.map(it=>foodById(it[0])?.name||'?').join(', '));
    const kc=s.e?s.e.kcal:itemsMacros(m.items).kcal;const extra=dayLog(d).filter(e=>e.meal===slot&&!e.planKey);
    return `<div class="todaymeal" style="flex-wrap:wrap"><span class="tm">${fmtTime(S.profile.mealTimes[slot])}</span><div class="info"><div><b>${SLOT_L[slot]}</b> ${statusPill(s)}</div><div class="small muted">${s.st==='skipped'?(isFast(s.key)?'Fasted':'Skipped'):esc(label)+` · <span class="num">${fmt(kc)} kcal</span>`}</div>${extra.length?`<div class="small">+ ${extra.map(e=>esc(e.name)).join(', ')}</div>`:''}</div><div class="row" style="width:100%;padding-left:72px">${slotActions(s)}</div></div>`;}).join('');
  const ex=dayLog(d).filter(e=>e.meal==='extra');
  const allFast=dayFasted(d);
  return `<p class="hint" style="margin-top:0">${S.profile.autoLog?'Planned meals log themselves at meal time. Tap <b>Substitute</b> if you eat something different, or <b>Fasted</b> if you didn’t eat.':'Tap <b>Ate it</b> when you eat a planned meal, <b>Substitute</b> if you ate something different, or <b>Fasted</b> if you didn’t eat.'}</p>
  <div class="row" style="margin-bottom:6px"><button class="btn sm ${allFast?'':'ghost'}" data-act="fastDay" data-date="${d}">${allFast?'Undo fasting day':'Fasting today'}</button></div>${rows}${ex.length?`<div class="todaymeal"><span class="tm">Any</span><div class="info"><b>Additional</b><div class="small muted">${ex.map(e=>esc(e.name)).join(', ')}</div></div></div>`:''}`;
}
function weekBars(d){
  const T=S.profile.targets;const ds=weekDates(d);
  return `<div class="weekbars">${ds.map((x,i)=>{const t=dayTotals(x);const pct=Math.min(t.kcal/(T.kcal*1.3)*100,100);const over=t.kcal>T.kcal*1.1;
    const pHit=t.p>=T.protein*0.9;const g=S.workouts.some(w=>w.date===x&&w.status==='completed');
    return `<button class="wb ${x===today()?'today':''}" data-act="pickDate" data-date="${x}" data-goto="food" aria-label="${DAYF[i]}: ${fmt(t.kcal)} kcal"><div class="col"><span class="tline" style="bottom:${(1/1.3*100).toFixed(0)}%"></span><i class="${over?'over':''}" style="height:${pct}%"></i></div><div class="dots"><em class="${pHit?'p':''}"></em><em class="${g?'g':''}"></em></div><span>${DAYN[i][0]}</span></button>`;}).join('')}</div>
  <div class="legend" style="margin-top:10px"><span><i style="background:var(--accent)"></i>Calories (dashed = target)</span><span><i style="background:var(--accent)"></i>Protein ≥90%</span><span><i style="background:var(--fat)"></i>Workout done</span></div>`;
}
function roadQuick(){

}

/* chicken */
const YIELD={baked:.72,grilled:.70,airfried:.70,stewed:.78,fried:.70};
const METHOD_L={baked:'Baked',grilled:'Grilled',airfried:'Air-fried',stewed:'Stewed',fried:'Fried'};
const SKIN={kcal:450,p:19,f:40};
function chickenCalc(o){
  const ref=S.profile.thighRef,y=YIELD[o.method]||.72;
  const fb=o.bone==='bonein'?.21:0,fs=o.skin==='on'?.14:0,fm=.65,sf=fb+fs+fm,nb=fb/sf,ns=fs/sf,nm=fm/sf;
  const n=Math.max(1,Math.round(+o.count||1)),W=+o.w,hasW=W>0&&o.mode!=='none';
  let raw,meat;
  if(hasW&&o.mode==='meat'){meat=W;raw=meat/y/nm;}
  else if(hasW&&o.mode==='raw'){raw=W;}
  else if(hasW&&o.mode==='cooked'){raw=W/(nb+ns*.6+nm*y);}
  else raw=n*160*sf;
  if(meat==null)meat=raw*nm*y;
  const bone=raw*nb,skinT=raw*ns*.6,skin=o.skin==='on'&&o.skinEaten==='yes'?skinT:0;
  let kcal=meat*ref.kcal/ref.g+skin*SKIN.kcal/100,p=meat*ref.p/ref.g+skin*SKIN.p/100,f=meat*ref.f/ref.g+skin*SKIN.f/100;
  const notes=[];
  if(o.method==='fried'){kcal+=n*36;f+=n*4;notes.push('Frying adds about 4 g absorbed oil per thigh (more with flour or batter).');}
  if(o.method==='stewed')notes.push('The stew sauce and its oil are not included. Log the stew separately.');
  if(!hasW)notes.push(`No weight entered, so this assumes a typical thigh of about ${Math.round(160*sf)} g raw. A kitchen scale makes this much more accurate.`);
  if(o.mode==='meat')notes.push('You weighed the edible meat directly. This is the most accurate option.');
  return {n,raw,bone,meat,skin,skinT,kcal,p,f,c:0,notes};
}
function chickenDesc(o,r){return `${r.n} chicken thigh${r.n>1?'s':''}, ${METHOD_L[o.method].toLowerCase()}, ${o.skin==='on'?(o.skinEaten==='yes'?'skin eaten':'skin removed'):'skinless'}`;}

const FRUIT=new Set(['banana','apple','orange','berries']),EXTRA=new Set(['nuts','groundnut','pb','honey']);
const DRINKY=new Set(['whey','shake','milk','yogurt','cottage','yogcup']);
const BF_CARB=new Set(['oats','bread','agege','pap','yam','plantboil','sweetpot']),BF_ONLY=new Set(['oats','bread','agege','pap']);
const BF_PROT=new Set(['egg','yogurt','whey','milk','cottage','moimoi','akara','yogcup','shake']);
const SN_PROT=new Set(['egg','yogurt','whey','cottage','shake','tuna','suya','moimoi','yogcup']);
const SN_CARB=new Set(['corn','banana','apple','orange','berries','plantroast','beans','akara']);
function prepRole(fd){
  if(!fd)return 'side';if(FRUIT.has(fd.id))return 'fruit';if(EXTRA.has(fd.id))return 'extra';
  if(!(fd.kcal>0))return 'side';if(fd.bu==='tbsp'&&fd.f*9>=fd.kcal*.8)return 'oil';
  const pp=fd.p*4/fd.kcal,cp=fd.c*4/fd.kcal;
  if(pp>=.33)return 'protein';if(cp>=.6)return 'carb';if(cp>=.4&&pp>=.15)return 'mixed';return 'side';
}
const isDry=fd=>fd.state==='raw'&&fd.bu==='g'&&fd.kcal>=300;
function prepDefQty(fd,role,ctx){
  if(fd.bu==='g'){if(role==='oil')return 0;if(isDry(fd))return ctx==='snack'?40:70;if(DRINKY.has(fd.id))return 170;
    if(role==='protein')return ctx==='main'?150:100;if(role==='carb'||role==='mixed')return ctx==='main'?200:150;
    if(role==='fruit')return 100;if(role==='extra')return 20;return ctx==='main'?100:80;}
  if(fd.bu==='piece'){if(fd.id==='egg')return ctx==='bfast'?3:2;if(fd.id==='bread')return 2;if(fd.id==='akara')return 3;return 1;}
  if(fd.bu==='tbsp')return role==='oil'?.5:1;return 1;
}
function prepRound(fd,q,role,ctx){
  if(fd.bu==='g'){const mx=isDry(fd)?110:role==='protein'?(ctx==='main'?250:150):(role==='carb'||role==='mixed')?(ctx==='main'?350:200):200,mn=isDry(fd)?30:40;return Math.min(mx,Math.max(mn,Math.round(q/10)*10));}
  if(fd.bu==='piece')return Math.min(fd.id==='egg'?(ctx==='bfast'?3:2):4,Math.max(1,Math.round(q)));
  return Math.min(3,Math.max(.5,Math.round(q*2)/2));
}

function buildPrepPlan(ids,seed=0){
  const T=S.profile.targets,fs=[...new Set(ids)].map(id=>foodById(id)).filter(Boolean);
  const role=f=>prepRole(f),by=r=>fs.filter(f=>role(f)===r),inSet=set=>fs.filter(f=>set.has(f.id));
  let MP=by('protein').filter(f=>!DRINKY.has(f.id)&&!['egg','moimoi','akara'].includes(f.id));if(!MP.length)MP=by('protein').filter(f=>!DRINKY.has(f.id));if(!MP.length)MP=by('protein');

  const MCmain=MC.filter(f=>f.id==='beans'||!SN_CARB.has(f.id));if(MCmain.length)MC=MCmain; // corn, fruit, bole stay snacks when real starches exist
  const fatty=f=>f.kcal>0&&f.f*9/f.kcal>.45;
  const MS=by('side'),MSlean=MS.filter(f=>!fatty(f)),OIL=by('oil'),BC=inSet(BF_CARB),BP=inSet(BF_PROT),SC=fs.filter(f=>SN_CARB.has(f.id)||role(f)==='fruit'),EXT=by('extra');
  const shake=S.prep.bfast!=='food'&&['whey','milk','banana','oats'].every(id=>foodById(id));
  const SPall=inSet(SN_PROT),SPnoEgg=SPall.filter(f=>f.id!=='egg'),eggBfast=!shake&&BP.some(f=>f.id==='egg');
  if(!MP.length&&!MC.length)return {error:'Pick at least one protein (meat, fish, eggs, beans) and one carb (rice, pasta, yam, swallow) so the app can build meals.'};
  const pick=(a,i)=>a.length?a[((i%a.length)+a.length)%a.length]:null,half=a=>Math.max(1,a.length>>1);
  const plan=[];
  for(let d=0;d<7;d++){

    const sideA=pick(MS,i),sideB=sideA&&fatty(sideA)?pick(MSlean,i+1):pick(MS,i+1);const lunchFirst=d%2===0;
    meals.lunch=[[pick(MP,i),'main'],[pick(MC,i),'main'],[lunchFirst?sideA:sideB,'main'],[OIL[0],'main']];
    meals.dinner=[[pick(MP,i+half(MP)),'main'],[pick(MC,i+half(MC)),'main'],[lunchFirst?sideB:sideA,'main'],[OIL[0],'main']];
    // eggs: breakfast plus at most one snack a day
    const SP=SPnoEgg.length?SPnoEgg:SPall,eggSnack1=!SPnoEgg.length&&(!eggBfast||d%2===0),eggSnack2=!SPnoEgg.length&&!eggBfast&&d%2===1;
    const sp1=SPnoEgg.length?pick(SP,i):(eggSnack1||!eggBfast?pick(SPall,i):null),sp2=SPnoEgg.length?pick(SP,i+1):((eggBfast?d%2===1:eggSnack2)?pick(SPall,i+1):null);
    meals.breakfast=(BC.length||BP.length)?[[pick(BC,i),'bfast'],[pick(BP,i),'bfast'],BC.length?null:[pick(fs.filter(f=>role(f)==='fruit'),i)||pick(MC,i+2),'snack'],BP.length?null:[pick(MP,i+2),'snack']]:[[pick(MP,i+2),'snack'],[pick(MC,i+2),'snack']];
    if(shake)meals.breakfast=SHAKE_ITEMS.map(([id,q])=>[foodById(id),'shake',q]);
    const s1=[[sp1,'snack'],[pick(SC,i),'snack']],s2=[[pick(SC,i+1),'snack'],[sp2,'snack'],d%2&&EXT.length?[pick(EXT,i),'snack']:null];
    meals.snack1=s1.some(x=>x&&x[0])?s1:[[pick(EXT,i)||pick(MC,i+1),'snack']];
    meals.snack2=s2.some(x=>x&&x[0])?s2:[[pick(MP,i+3),'snack'],[pick(MC,i+3),'snack']];
    // default portions, tagged P (protein-scaled), C (carb-scaled) or F (fixed)
    const rows=[];PSLOTS.forEach(slot=>{const seen=new Set();(meals[slot]||[]).forEach(x=>{if(!x||!x[0]||seen.has(x[0].id))return;seen.add(x[0].id);const f=x[0],r=role(f);const q=x[2]??prepDefQty(f,r,x[1]);if(!q)return;
      // in the shake only the whey (protein) and oats (carbs) flex; milk and banana stay as written
      const tag=x[1]==='shake'?(f.id==='whey'?'P':f.id==='oats'?'C':'F'):(r==='protein'?'P':(r==='carb'||r==='mixed')?'C':'F');
      rows.push({slot,f,r,q,ctx:x[1],tag});});});
    const tot=tag=>sum(rows.filter(x=>x.tag===tag).map(x=>scaleFood(x.f,x.q)));
    const Fx=tot('F'),Pp=tot('P'),Cc=tot('C');
    let kP=1,kC=1;const det=Pp.p*Cc.kcal-Cc.p*Pp.kcal;
    if(Pp.p>0&&Cc.kcal>0&&Math.abs(det)>1e-6){kP=((T.protein-Fx.p)*Cc.kcal-Cc.p*(T.kcal-Fx.kcal))/det;}
    else if(Pp.p>0)kP=(T.protein-Fx.p-Cc.p)/Pp.p;
    kP=Math.min(1.8,Math.max(.6,kP));
    if(Cc.kcal>0)kC=Math.min(1.8,Math.max(.5,(T.kcal-Fx.kcal-kP*Pp.kcal)/Cc.kcal));

      day[slot]={items,...(slot==='breakfast'&&shake?SHAKE_MEAL:prepSubs(slot,items))};});
    plan.push(day);
  }
  return {plan};
}
function prepSubs(slot,items){
  const fsx=items.map(([id])=>foodById(id)).filter(Boolean);
  const carb=fsx.find(f=>['carb','mixed'].includes(prepRole(f))),prot=fsx.find(f=>prepRole(f)==='protein');
  const main=slot==='lunch'||slot==='dinner',pid=prot?prot.id:'';
  const ng=main&&carb&&carb.cuisine!=='Nigerian'?`Swap the ${carb.name.toLowerCase()} for boiled yam (same weight) or a fist-sized portion of eba or amala.`:'As listed.';
  const am=main&&carb&&carb.cuisine==='Nigerian'?`Swap the ${carb.name.toLowerCase()} for rice, pasta or potatoes (about the same weight).`:'As listed.';
  const road=!main?(slot==='breakfast'?'Greek yogurt cup + protein shake + fruit':'Protein shake + fruit, or 2 boiled eggs')
    :/thigh|chbreast|rotis|turkey/.test(pid)?'Rotisserie chicken (skin off) + microwave rice, or a chicken rice bowl'
    :/gbeef|sirloin|suya|goat/.test(pid)?'Lean beef plate or burger bowl, no fries'
    :/tilapia|salmon|cod|tuna/.test(pid)?'Grilled fish plate with rice and vegetables':'Chicken rice bowl with double chicken';
  return {ng,am,road,prep:main?'From your batch cook. Reheat until steaming hot all the way through.':''};
}
function planStats(plan){const T=S.profile.targets;const days=plan.map(day=>sum(PSLOTS.map(s=>itemsMacros(day[s].items))));
  const avg=sum(days);['kcal','p','c','f'].forEach(k=>avg[k]/=days.length);
  const agg={},fat={};plan.forEach(day=>PSLOTS.forEach(s=>day[s].items.forEach(([id,q])=>{agg[id]=(agg[id]||0)+q;const fd=foodById(id);if(fd)fat[id]=(fat[id]||0)+scaleFood(fd,q).f;})));
  const warn=[];
  if(avg.p<T.protein*.9){const opts=['yogurt','whey','chbreast','tuna','cottage'].filter(id=>!plan.some(day=>PSLOTS.some(s=>day[s].items.some(it=>it[0]===id))));
    warn.push({kind:'warn',text:`Protein averages ${fmt(avg.p)} g, about ${fmt(T.protein-avg.p)} g under your target. Adding a lean protein fixes this:`,add:opts.slice(0,3)});}
  if(avg.f>T.fat*1.15){const top=Object.entries(fat).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([id])=>foodById(id)?.name.toLowerCase());

function series(metric){
  const ms=[...S.measurements].sort((a,b)=>a.date.localeCompare(b.date));
  const T=S.profile.targets;
  const days=[...new Set(S.log.map(e=>e.date))];
  switch(metric){
    case 'weight':return {pts:ms.filter(m=>m.weightKg!=null).map(m=>({x:m.date,y:kgD(m.weightKg)})),unit:wu()};
    case 'wavg':{const g={};ms.filter(m=>m.weightKg!=null).forEach(m=>{const k=mondayOf(m.date);(g[k]=g[k]||[]).push(kgD(m.weightKg));});return {pts:Object.entries(g).map(([k,v])=>({x:k,y:v.reduce((a,b)=>a+b,0)/v.length})),unit:wu()};}
    case 'waist':case 'chest':case 'arm':case 'hip':return {pts:ms.filter(m=>m[metric+'Cm']!=null).map(m=>({x:m.date,y:cmD(m[metric+'Cm'])})),unit:lu()};
    case 'kcal':return {pts:days.map(d=>({x:d,y:dayTotals(d).kcal})),unit:'kcal',target:T.kcal};
    case 'protein':return {pts:days.map(d=>({x:d,y:dayTotals(d).p})),unit:'g',target:T.protein};
    case 'steps':return {pts:[...new Set(S.activity.map(a=>a.date))].map(d=>({x:d,y:stepsOn(d)})),unit:'',target:T.steps||null};
    case 'stretch':return {pts:Object.entries(S.days).filter(([,v])=>v.stretch!=null).map(([d,v])=>({x:d,y:+v.stretch})),unit:'min',target:T.stretchMin||null};
    case 'pain':return {pts:Object.entries(S.days).filter(([,v])=>v.pain!=null).map(([d,v])=>({x:d,y:+v.pain})),unit:'/10'};
    case 'lift':{const ex=ui.liftEx;const pts=[];S.workouts.filter(w=>w.status==='completed').forEach(w=>{const xs=w.exercises.filter(e=>e.name===ex&&e.weight!=null);if(xs.length)pts.push({x:w.date,y:Math.max(...xs.map(e=>liftD(+e.weight,w.wu||'lb')))});});return {pts,unit:wu()};}
  }
  return {pts:[]};
}

function weekStats(mon){
  const ds=weekDates(mon),T=S.profile.targets,prev=weekDates(addDays(mon,-7));
  const logged=ds.filter(d=>dayLog(d).length);const tots=logged.map(dayTotals);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const avgK=avg(tots.map(t=>t.kcal)),avgP=avg(tots.map(t=>t.p));
  const met=logged.filter(d=>{const t=dayTotals(d);return Math.abs(t.kcal-T.kcal)<=T.kcal*.1&&t.p>=T.protein*.9;}).length;
  const gym=S.workouts.filter(w=>ds.includes(w.date)&&w.status==='completed'&&w.template!=='recovery').length;
  const st=ds.map(stepsOn).filter(x=>x>0);
  const stepGoalDays=T.steps?ds.filter(d=>stepsOn(d)>=T.steps).length:0;
  const stretchDays=ds.filter(d=>(+dayInfo(d).stretch||0)>=(T.stretchMin||1)).length;
  const stretchTot=ds.reduce((n,d)=>n+(+dayInfo(d).stretch||0),0);
  const wIn=dd=>S.measurements.filter(m=>dd.includes(m.date)&&m.weightKg!=null).map(m=>m.weightKg);
  const wNow=avg(wIn(ds)),wPrev=avg(wIn(prev));
  const wsort=[...S.measurements].filter(m=>m.waistCm!=null).sort((a,b)=>a.date.localeCompare(b.date));
  const waistNow=[...wsort].reverse().find(m=>m.date<=ds[6]&&m.date>=ds[0]);const waistBefore=[...wsort].reverse().find(m=>m.date<ds[0]);
  const pIn=dd=>dd.map(d=>dayInfo(d).pain).filter(x=>x!=null).map(Number);
  const painNow=avg(pIn(ds)),painPrev=avg(pIn(prev)),painMax=pIn(ds).length?Math.max(...pIn(ds)):null;
  const worse=S.activity.filter(a=>ds.includes(a.date)&&a.painAfter!=null&&a.painBefore!=null&&a.painAfter>a.painBefore).length;
  const upto=ds.filter(d=>d<=today());const keys=upto.flatMap(d=>PSLOTS.map(s=>d+'|'+s));
  const fasted=keys.filter(isFast).length,subs=keys.filter(k=>S.log.some(e=>e.planKey===k&&e.sub)).length;
  const planned=keys.length-fasted;const eaten=keys.filter(k=>S.log.some(e=>e.planKey===k)).length;
  return {ds,logged:logged.length,avgK,avgP,met,gym,avgSteps:avg(st),stepDays:st.length,stepGoalDays,stretchDays,stretchTot,wNow,wPrev,waistNow,waistBefore,painNow,painPrev,painMax,worse,planned,eaten,fasted,subs};
}
function suggestions(w){
  const T=S.profile.targets,out=[];
  if(w.painMax!=null&&w.painMax>=7||w.worse>=2||(w.painNow!=null&&w.painPrev!=null&&w.painNow>w.painPrev+0.5))out.push('<b>Recovery first.</b> Pain rose or hit a high score this week. Book or follow up on your medical assessment, swap walks for rest or gentle seated work, and keep nutrition steady. Progress continues on rest days.');
  if(w.logged<4)out.push('<b>Log at least 4 days.</b> Even rough entries make next week’s averages meaningful. Use “Ate it” on the planned meals to log in one tap.');
  if(w.avgP!=null&&w.avgP<T.protein*.9)out.push(`<b>Protein:</b> you averaged ${fmt(w.avgP)} g against ${T.protein} g. Add one protein-rich snack (Greek yogurt, eggs or a shake) rather than eating more overall.`);
  if(w.avgK!=null&&w.avgK>T.kcal*1.1)out.push(`<b>Portions:</b> calories averaged ${fmt(w.avgK)}, about ${fmt(w.avgK-T.kcal)} over target. Check oil, swallow and rice portions first; they move the numbers most.`);
  if(w.avgK!=null&&w.avgK<T.kcal*.8)out.push(`<b>Eat enough:</b> you averaged ${fmt(w.avgK)} kcal, well under your target. Eating much less doesn’t speed fat loss safely; it costs muscle, energy and recovery. Add the planned snacks back.`);
  if(w.wNow!=null&&w.wPrev!=null){const pct=(w.wPrev-w.wNow)/w.wPrev*100;if(pct>1)out.push('<b>Weight is dropping fast</b> (over 1% of body weight this week). Some of that is water, but consider adding 150–250 kcal to protect muscle.');}
  const hurt=w.painMax>=7||w.worse>=2;
  if(w.gym<T.gym-1&&!hurt)out.push(`<b>Training:</b> ${w.gym} of ${T.gym} gym sessions this week. Lock the days into your schedule, and go only when pain allows.`);
  if(w.gym>=T.gym&&w.painNow!=null&&w.painPrev!=null&&w.painNow>w.painPrev)out.push(`<b>Training load:</b> you hit ${w.gym} sessions, but pain rose. Try swapping one session for a recovery day next week.`);
  if(T.steps&&w.stepGoalDays<5&&!hurt)out.push(`<b>Steps:</b> ${w.stepGoalDays} days reached ${fmt(T.steps)}. A 10-minute walk after lunch and dinner usually closes the gap.`);
  if(T.stretchMin&&w.stretchDays<4)out.push(`<b>Stretching:</b> ${w.stretchDays} days at your ${T.stretchMin}-minute goal. Pair it with something you already do, like right after a workout or before bed. Leave out any stretch that brings on hip or waist pain.`);
  if(w.planned&&w.eaten/w.planned<.5)out.push('<b>Meal prep:</b> fewer than half of the planned meals were followed. On Sunday, cook rice, beans, a tray of chicken thighs and boil a dozen eggs.');
  if(!out.length)out.push('<b>Keep the routine.</b> Targets, training and recovery all look on track. Change one thing at most next week.');
  return out;
}

let pendingConfirm=null,toastT=null;
function openModal(title,body){const m=$('#modal');m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><h2>${esc(title)}</h2><button class="iconbtn" data-act="closeModal" aria-label="Close">${I.x}</button></div><div class="sheet-b">${body}</div></div>`;m.hidden=false;document.body.classList.add('noscroll');}

function toast(msg,kind=''){const t=$('#toast');t.textContent=msg;t.className=kind;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},kind?5200:2600);}
function commit(msg,kind){save();render();if(msg)toast(msg,kind);}
function formErr(f,msg){const e=f.querySelector('.form-err');if(e){e.textContent=msg;e.hidden=false;e.scrollIntoView({block:'nearest'});}else toast(msg,'danger');}

/* number parsing with validation */
function num(fd,name,label,{min=0,max=1e7,int=false,req=false}={}){
  const raw=(fd.get(name)??'').toString().trim().replace(',','.');
  if(raw===''){if(req)throw new VErr(`${label} is required.`);return null;}
  const n=Number(raw);
  if(!isFinite(n))throw new VErr(`${label} must be a number.`);
  if(n<min)throw new VErr(`${label} can’t be below ${min}.`);
  if(n>max)throw new VErr(`${label} looks too high (max ${max}).`);
  return int?Math.round(n):n;
}
const dateOK=(s,label='Date')=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))throw new VErr(`${label} is missing.`);return s;};

function startWorkout(tk,date){
  const t=allT()[tk];if(!t){toast('Template not found','danger');return;}
  const lc=S.profile.clearance.lower;const left=t.ex.filter(e=>e.pending&&!lc);
  if(t.pending&&!lc&&left.length===t.ex.length){openModal('Needs medical clearance',`<p>Every exercise in <b>${esc(t.name)}</b> is pending medical clearance for your hip and waist pain.</p><p class="small muted">Choose an upper-body or recovery session today. Once a clinician clears you, turn on lower-body clearance in Settings.</p><div class="row end"><button class="btn" data-act="closeModal">OK</button><button class="btn primary" data-act="startWorkout" data-tpl="recovery" data-date="${date}">Start recovery session</button></div>`);return;}
  const w={id:uid(),date,template:tk,name:t.name,muscles:t.muscles,status:'planned',duration:null,wu:wu(),notes:'',pendingNote:left.map(e=>e.name).join(', '),
    exercises:t.ex.filter(e=>!e.pending||lc).map(e=>({name:e.name,sets:e.sets,reps:e.reps,unit:e.unit||'reps',weight:null,rest:e.rest,done:false}))};
  const last=[...S.workouts].filter(x=>x.template===tk&&x.status==='completed').sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(last)w.exercises.forEach(e=>{const p=last.exercises.find(x=>x.name===e.name);if(p&&p.weight!=null)e.weight=+r1(liftD(+p.weight,last.wu||'lb'));});
  S.workouts.push(w);save();render();openModal(w.name,workoutForm(clone(w)));
}
function logChicken(o,meal,label){
  const r=chickenCalc(o);
  S.log.push({id:uid(),date:ui.date,meal,time:S.profile.mealTimes[meal]||nowTime(),name:label||('Chicken thighs: '+chickenDesc(o,r)),cuisine:'Both',qty:Math.round(r.meat+r.skin),unit:'g',state:'cooked',kcal:r1(r.kcal),p:r1(r.p),c:0,f:r1(r.f),est:true,
    notes:`${chickenDesc(o,r)}. ${fmt(r.meat)} g edible meat${r.skin?` + ${fmt(r.skin)} g skin`:''}; bone excluded.`});
  commit(`Logged ${fmt(r.p)} g protein to ${SLOT_L[meal]}`);
}

    if(rk){S.log=S.log.filter(x=>x.planKey!==rk);e.planKey=rk;e.sub=true;S.log.push(e);delete S.planSkip[rk];closeModal();commit('Substitute logged');return;}
    if(i>=0){const old=S.log[i];if(old.planKey&&old.date===e.date&&old.meal===e.meal){e.planKey=old.planKey;e.sub=true;}S.log[i]=e;}else S.log.push(e);
    ui.date=e.date;closeModal();commit('Saved');
  },
  libfood:(fd)=>{
    const name=(fd.get('name')||'').toString().trim();if(!name)throw new VErr('Give the food a name.');
    const id=fd.get('id');const bq=num(fd,'bq','Per quantity',{max:10000,req:true});if(bq<=0)throw new VErr('Per quantity must be more than 0.');
    const x={name,cuisine:fd.get('cuisine'),cat:fd.get('cat'),bq,bu:fd.get('bu'),state:fd.get('state'),kcal:num(fd,'kcal','Calories',{max:10000,req:true}),p:num(fd,'p','Protein',{max:1000})??0,c:num(fd,'c','Carbs',{max:2000})??0,f:num(fd,'f','Fat',{max:1000})??0,est:fd.get('est')==='on',road:fd.get('road')==='on',notes:(fd.get('notes')||'').toString().trim()};
    if(id){const o=foodById(id);Object.assign(o,x);}else S.foods.push({id:'u'+uid(),custom:true,buy:null,...x});
    closeModal();commit('Food saved');
  },
  chickLog:(fd)=>{const o={...ui.chick};logChicken(o,o.meal||'lunch');},
  times:(fd)=>{PSLOTS.forEach(s=>{S.profile.mealTimes[s]=fd.get('mt_'+s)||'';});closeModal();commit('Meal times saved');},
  startWorkout:(fd)=>startWorkout(fd.get('tpl'),dateOK(fd.get('date'))),
  workout:(fd,f)=>{
    const id=fd.get('id');const w=S.workouts.find(x=>x.id===id);if(!w)throw new VErr('Workout not found.');
    const ex=$$('.exrow',f).map(r=>{const g=c=>r.querySelector(c).value.trim();const n=(c,l,o)=>{const v=g(c);if(v==='')return null;const x=Number(v);if(!isFinite(x)||x<0)throw new VErr(`${l} must be zero or more.`);if(o&&x>o)throw new VErr(`${l} looks too high.`);return x;};
      return {name:g('.x-name'),sets:n('.x-sets','Sets',100),reps:n('.x-reps','Reps or time',1000),unit:r.querySelector('.x-unit').value,weight:n('.x-wt','Weight',2000),rest:n('.x-rest','Rest',3600),done:r.querySelector('.x-done').checked};}).filter(e=>e.name);
    Object.assign(w,{date:dateOK(fd.get('date')),status:fd.get('status'),name:(fd.get('name')||'Workout').toString().trim()||'Workout',muscles:(fd.get('muscles')||'').toString(),duration:num(fd,'duration','Duration',{max:600,int:true}),wu:fd.get('wu'),notes:(fd.get('notes')||'').toString(),exercises:ex});
    delete w.pendingNote;
    if(fd.get('saveTpl')==='on'){const k='t'+uid();S.templates[k]={name:w.name,muscles:w.muscles,ex:ex.map(e=>({name:e.name,sets:e.sets||3,reps:e.reps||10,unit:e.unit||'reps',rest:e.rest||60,pending:false}))};w.template=k;}
    closeModal();commit(w.status==='completed'?'Workout saved. Nice work.':'Workout saved');
  },
  sub:(fd)=>{
    const key=fd.get('key');const [date,slot]=key.split('|');const e=S.log.find(x=>x.planKey===key);const m=S.plan[wdIdx(date)][slot];
    const base=e&&e.items&&!e.sub?e.items:m.items;const changes=[];
    const items=base.map(([id,q],k)=>{const nid=fd.get('sw_'+k);if(!nid)return [id,q];const a=foodById(id),b=foodById(nid);if(!a||!b)return [id,q];
      const ka=a.kcal/(a.bq||1),kb=b.kcal/(b.bq||1);let nq=kb>0?q*ka/kb:q;
      nq=b.bu==='g'?Math.max(10,Math.round(nq/10)*10):b.bu==='piece'?Math.max(1,Math.round(nq)):Math.max(.5,Math.round(nq*2)/2);
      changes.push(`${a.name} → ${b.name}`);return [nid,nq];});
    if(!changes.length)throw new VErr('Choose a food to swap, or tap “Ate something else”.');
    S.log=S.log.filter(x=>x.planKey!==key);delete S.planSkip[key];
    S.log.push(itemsEntry(date,slot,items,`Swapped ${changes.join(', ')}: `,{sub:true}));closeModal();commit('Swap logged');
  },
  tpl:(fd,f)=>{
    const name=(fd.get('name')||'').toString().trim();if(!name)throw new VErr('Give the workout type a name.');
    const ex=$$('.tplrow',f).map(r=>{const g=c=>r.querySelector(c).value.trim();const n=(c,l,mx)=>{const v=g(c);if(v==='')return null;const x=Number(v);if(!isFinite(x)||x<0)throw new VErr(`${l} must be zero or more.`);if(x>mx)throw new VErr(`${l} looks too high.`);return Math.round(x);};
      return {name:g('.t-name'),sets:n('.t-sets','Sets',100)??3,reps:n('.t-reps','Reps or time',1000)??10,unit:r.querySelector('.t-unit').value,rest:n('.t-rest','Rest',3600)??60,pending:r.querySelector('.t-pend').checked};}).filter(e=>e.name);
    if(!ex.length)throw new VErr('Add at least one exercise.');
    const id=fd.get('id')||('t'+uid());
    S.templates[id]={name,muscles:(fd.get('muscles')||'').toString().trim(),ex,pending:ex.every(e=>e.pending)};
    closeModal();commit('Workout type saved');
  },
  activity:(fd)=>{
    const pb=num(fd,'painBefore','Pain before',{max:10,int:true}),pa=num(fd,'painAfter','Pain after',{max:10,int:true});
    let effect=fd.get('effect')||'';if(!effect&&pb!=null&&pa!=null)effect=pa>pb?'worse':pa<pb?'better':'unchanged';
    const dist=num(fd,'dist','Distance',{max:200}),run=S.profile.clearance.running?num(fd,'run','Running distance',{max:100}):null;
    const a={id:fd.get('id')||uid(),date:dateOK(fd.get('date')),steps:num(fd,'steps','Steps',{max:100000,int:true}),walkMin:num(fd,'walkMin','Walking time',{max:1440}),distKm:dist==null?null:dKm(dist),runKm:run==null?null:dKm(run),painBefore:pb,painAfter:pa,location:(fd.get('location')||'').toString().trim(),effect,notes:(fd.get('notes')||'').toString().trim()};
    const i=S.activity.findIndex(x=>x.id===a.id);if(i>=0)S.activity[i]=a;else S.activity.push(a);
    if(a.date===today()&&pa!=null)setDay(a.date,{pain:pa});
    closeModal();save();render();
    if(pa!=null&&pa>=7)openModal('Pain is high',`<div class="banner danger"><b>Pain after activity: ${pa}/10.</b> Stop activity for today and rest. Contact your doctor, and get urgent care if it comes with fever, numbness or weakness, trouble bearing weight, or bladder or bowel changes.</div><p class="small">Skipping training to recover never breaks your streak here. Log a rest day instead.</p><div class="row end"><button class="btn primary" data-act="closeModal">OK</button></div>`);
    else if(pb!=null&&pa!=null&&pa>pb)toast(`Pain rose from ${pb} to ${pa}. Next time go shorter or flatter, or rest.`,'warn');
    else toast('Activity saved');
  },
  measure:(fd)=>{
    const w=num(fd,'weight','Weight',{max:1000}),wa=num(fd,'waist','Waist',{max:400}),ch=num(fd,'chest','Chest',{max:400}),ar=num(fd,'arm','Arm',{max:200}),hp=num(fd,'hip','Hip',{max:400});
    if(w==null&&wa==null&&ch==null&&ar==null&&hp==null&&!fd.get('photo'))throw new VErr('Enter at least one measurement or add a photo.');
    if(w!=null&&dKg(w)<30)throw new VErr('That weight looks too low. Check the unit in Settings.');
    const id=fd.get('id');const old=id?S.measurements.find(x=>x.id===id):null;
    const m={id:id||uid(),date:dateOK(fd.get('date')),weightKg:w==null?null:dKg(w),waistCm:dCm(wa),chestCm:dCm(ch),armCm:dCm(ar),hipCm:dCm(hp),notes:(fd.get('notes')||'').toString().trim()};
    const ph=fd.get('photo');m.photo=ph?ph:(old&&old.photo&&fd.get('rmPhoto')!=='on'?old.photo:null);if(!m.photo)delete m.photo;
    if(old)Object.assign(old,m,{sample:false});else S.measurements.push(m);
    closeModal();commit('Measurements saved');
  },
  settings:(fd)=>{
    const p=S.profile;const nu=fd.get('uw');
    const sw=num(fd,'startW','Starting weight',{max:1000,req:true});
    const t={kcal:num(fd,'kcal','Calories',{min:800,max:8000,req:true}),protein:num(fd,'protein','Protein',{max:500,req:true}),carbs:num(fd,'carbs','Carbs',{max:1000,req:true}),fat:num(fd,'fat','Fat',{max:400,req:true}),waterMl:num(fd,'waterMl','Water',{max:10000})??0,steps:num(fd,'steps','Steps',{max:50000,int:true})??0,gym:num(fd,'gym','Gym sessions',{max:7,int:true})??0,stretchMin:num(fd,'stretchMin','Stretching',{max:180,int:true})??0};
    const ref={g:num(fd,'refG','Reference grams',{min:1,max:1000,req:true}),p:num(fd,'refP','Reference protein',{max:500,req:true}),kcal:num(fd,'refK','Reference kcal',{max:5000,req:true}),f:num(fd,'refF','Reference fat',{max:500})??0};
    p.startWeightKg=wu()==='lb'?sw/LB:sw;
    Object.assign(p,{name:(fd.get('name')||'').toString().trim(),heightCm:num(fd,'heightCm','Height',{min:100,max:250})??p.heightCm,startDate:fd.get('startDate')||p.startDate,targets:t,thighRef:ref,theme:fd.get('theme')||'system'});
    p.units={weight:nu,length:fd.get('ul'),distance:fd.get('ud')};
    PSLOTS.forEach(s=>p.mealTimes[s]=fd.get('mt_'+s)||'');
    p.clearance={lower:fd.get('clLower')==='on',running:fd.get('clRun')==='on'};
    const al=fd.get('autoLog')==='on';if(al&&!p.autoLog)S.prep.autoFrom=today();p.autoLog=al;
    commit(t.kcal<1800?'Saved. Note: under 1,800 kcal is aggressive for your size; check with a clinician.':'Settings saved',t.kcal<1800?'warn':'');
  },
  importPaste:(fd)=>doImport((fd.get('txt')||'').toString()),
};

/* export / import */
function csv(rows,cols){const q=v=>{if(v==null)return '';let s=String(v);if(typeof v==='string'&&/^[=+\-@]/.test(s))s="'"+s;return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};return [cols.join(','),...rows.map(r=>cols.map(c=>q(r[c])).join(','))].join('\r\n');}
function exportText(kind){
  const by=(a,b)=>a.date.localeCompare(b.date);
  switch(kind){
    case 'json':return [JSON.stringify({...S,exportedAt:new Date().toISOString(),app:'Athletic Body Project'},null,1),'application/json','json'];
    case 'food':return [csv([...S.log].sort(by).map(e=>({...e,est:e.est?'yes':'no',meal:SLOT_L[e.meal]||e.meal})),['date','time','meal','name','cuisine','qty','unit','state','kcal','p','c','f','est','notes']),'text/csv','csv'];
    case 'activity':return [csv([...S.activity].sort(by).map(a=>({...a,distance:a.distKm!=null?r1(kmD(a.distKm)):'',run:a.runKm!=null?r1(kmD(a.runKm)):'',unit:du()})),['date','steps','walkMin','distance','run','unit','painBefore','painAfter','location','effect','notes']),'text/csv','csv'];
    case 'workouts':return [csv([...S.workouts].sort(by).flatMap(w=>w.exercises.map(e=>({date:w.date,workout:w.name,status:w.status,duration:w.duration,exercise:e.name,sets:e.sets,amount:e.reps,countedIn:e.unit||'reps',weight:e.weight,unit:w.wu,rest:e.rest,done:e.done?'yes':'no',notes:w.notes}))),['date','workout','status','duration','exercise','sets','amount','countedIn','weight','unit','rest','done','notes']),'text/csv','csv'];
    case 'measure':return [csv([...S.measurements].sort(by).map(m=>({date:m.date,weight:m.weightKg!=null?r1(kgD(m.weightKg)):'',weightUnit:wu(),waist:m.waistCm!=null?r1(cmD(m.waistCm)):'',chest:m.chestCm!=null?r1(cmD(m.chestCm)):'',arm:m.armCm!=null?r1(cmD(m.armCm)):'',hip:m.hipCm!=null?r1(cmD(m.hipCm)):'',lengthUnit:lu(),photo:m.photo?'yes':'no',notes:m.notes})),['date','weight','weightUnit','waist','chest','arm','hip','lengthUnit','photo','notes']),'text/csv','csv'];
    case 'daily':return [csv(Object.entries(S.days).sort((a,b)=>a[0].localeCompare(b[0])).map(([d,v])=>({date:d,waterMl:v.water??'',pain:v.pain??'',stretchMin:v.stretch??'',restDay:v.rest?'yes':'no',steps:stepsOn(d)||''})),['date','waterMl','pain','stretchMin','restDay','steps']),'text/csv','csv'];
  }
}
function doExport(kind,mode){
  const [txt,mime,ext]=exportText(kind);
  if(mode==='copy'){copyText(txt,'Backup copied. Paste it somewhere safe.');return;}
  try{const blob=new Blob([txt],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`athletic-body-${kind}-${today()}.${ext}`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);toast('Download started. If nothing appears, use Copy instead.');}
  catch(e){copyText(txt,'Download blocked here, so the data was copied instead.');}
}
function copyText(txt,msg){
  const fallback=()=>openModal('Copy your data',`<p class="small">Select all of the text below and copy it.</p><textarea readonly style="min-height:240px;font-family:ui-monospace,monospace;font-size:12px" id="cpTxt">${esc(txt)}</textarea>`);
  try{navigator.clipboard.writeText(txt).then(()=>toast(msg),()=>{fallback();setTimeout(()=>{const t=$('#cpTxt');t&&t.select();},50);});}catch(e){fallback();}
}
function doImport(text){
  let obj;try{obj=JSON.parse(text);}catch(e){toast('That isn’t a valid backup file (JSON could not be read).','danger');return;}
  if(!obj||typeof obj!=='object'||!obj.profile||!Array.isArray(obj.log)){toast('That file doesn’t look like an Athletic Body Project backup.','danger');return;}
  confirmBox(`Restore this backup (${obj.log.length} food entries, ${(obj.workouts||[]).length} workouts, ${(obj.measurements||[]).length} measurements)? It replaces everything currently on this device.`,'Restore backup',()=>{delete obj.exportedAt;delete obj.app;S=migrate(obj);commit('Backup restored');});
}
function compressImage(file,max=560,q=0.72){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));};img.onerror=rej;img.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}

/* ================= wiring ================= */
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return;}
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const fn=A[el.dataset.act];if(!fn)return;
  if(el.tagName!=='INPUT'&&el.tagName!=='LABEL')e.preventDefault();
  try{fn(el,e);}catch(err){console.error(err);toast('Something went wrong: '+err.message,'danger');}
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(!el)return;const fn=C[el.dataset.chg]||(e.target.dataset.chg&&C[e.target.dataset.chg]);if(fn)try{fn(e.target.dataset.chg?e.target:el,e);}catch(err){console.error(err);toast('Something went wrong: '+err.message,'danger');}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.inp&&N[el.dataset.inp])N[el.dataset.inp](el,e);});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const fe=f.querySelector('.form-err');if(fe)fe.hidden=true;
  try{FORMS[f.dataset.form](new FormData(f),f);}catch(err){if(err instanceof VErr)formErr(f,err.message);else{console.error(err);toast('Something went wrong: '+err.message,'danger');}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();});

S=load();
if(firstRun)save();
render();
setInterval(()=>{if(autoLog()&&$('#modal').hidden&&!document.activeElement?.matches('input,select,textarea'))render();},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&autoLog()&&$('#modal').hidden)render();});
</script>
