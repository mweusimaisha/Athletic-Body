<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121413">
<meta name="mobile-web-app-capable" content="yes">
<title>Athletic Body Project</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="docs/icon-192.png">
<link rel="apple-touch-icon" href="docs/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}html,body{background:#121413}#boot{color:#9ca39b;font:15px system-ui,sans-serif;text-align:center;padding:40vh 16px 0}</style>
</head>
<body>
<div id="boot">Loading…</div>
<script>
// The whole app lives in app.html. This page loads it, so updates only ever change that one file.
fetch('app.html', { cache: 'no-cache' })
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(function (html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    document.getElementById('boot').remove();
    Array.prototype.forEach.call(doc.head.children, function (n) { if (n.tagName !== 'TITLE') document.head.appendChild(document.importNode(n, true)); });
    Array.prototype.forEach.call(doc.body.childNodes, function (n) {
      if (n.nodeName === 'SCRIPT') { var s = document.createElement('script'); s.textContent = n.textContent; document.body.appendChild(s); }
      else document.body.appendChild(document.importNode(n, true));
    });
  })
  .catch(function () { document.getElementById('boot').textContent = 'Could not load the app. Check your connection and reopen it.'; });
if ('serviceWorker' in navigator && location.protocol !== 'file:') { navigator.serviceWorker.register('sw.js').catch(function () {}); }
</script>
</body>
</html>
